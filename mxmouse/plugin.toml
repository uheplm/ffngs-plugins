  max = 100

  [[widget.setting]]
  key = "icon_progress_gap"
  type = "int"
  label_key = "settings.gesture_map.icon_progress_gap.label"
  description_key = "settings.gesture_map.icon_progress_gap.description"
  default = 3
  min = 0
  max = 24

