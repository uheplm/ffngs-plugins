id = "ffngs/mxmouse"
name = "MX Mouse"
version = "1.0.21"
plugin_api = 43
author = "ffngs"
license = "MIT"
icon = "mouse"
description = "Configure MX Master gestures and per-window presets for Niri."
dependencies = ["niri", "nnmxd", "noctalia", "install", "systemctl", "journalctl"]
tags = ["niri", "utility", "panel", "bar"]

[[setting]]
key = "workspace_glyphs"
type = "string"
label_key = "settings.workspace_glyphs.label"
description_key = "settings.workspace_glyphs.description"
default = ""

[[widget]]
id = "modifier"
entry = "widget.luau"

  [[widget.setting]]
  key = "hide_when_off"
  type = "bool"
  label_key = "settings.hide_when_off.label"
  description_key = "settings.hide_when_off.description"
  default = true

[[widget]]
id = "profile"
entry = "profile-widget.luau"

[[widget]]
id = "gesture-columns"
entry = "gesture-map-widget.luau"

  [[widget.setting]]
  key = "axis"
  type = "select"
  label_key = "settings.gesture_map.axis.label"
  default = "x"
  options = [
    { value = "x", label_key = "settings.gesture_map.axis.x" },
    { value = "y", label_key = "settings.gesture_map.axis.y" },
  ]

  [[widget.setting]]
  key = "layout"
  type = "select"
  label_key = "settings.gesture_map.layout.label"
  default = "horizontal"
  options = [
    { value = "horizontal", label_key = "settings.gesture_map.layout.horizontal" },
    { value = "vertical", label_key = "settings.gesture_map.layout.vertical" },
  ]

  [[widget.setting]]
  key = "show_progress_when_inactive"
  type = "bool"
  label_key = "settings.gesture_map.show_progress_when_inactive.label"
  description_key = "settings.gesture_map.show_progress_when_inactive.description"
  default = true

  [[widget.setting]]
  key = "shrink_inactive_workspace_pills"
  type = "bool"
  label_key = "settings.gesture_map.shrink_inactive_workspace_pills.label"
  description_key = "settings.gesture_map.shrink_inactive_workspace_pills.description"
  default = false

  [[widget.setting]]
  key = "workspace_pill_width"
  type = "int"
  label_key = "settings.gesture_map.workspace_pill_width.label"
  description_key = "settings.gesture_map.workspace_pill_width.description"
  default = 28
  min = 16
  max = 200

  [[widget.setting]]
  key = "workspace_pill_height"
  type = "int"
  label_key = "settings.gesture_map.workspace_pill_height.label"
  description_key = "settings.gesture_map.workspace_pill_height.description"
  default = 40
  min = 16
  max = 200

  [[widget.setting]]
  key = "animate_workspace_pill_resizing"
  type = "bool"
  label_key = "settings.gesture_map.animate_workspace_pill_resizing.label"
  description_key = "settings.gesture_map.animate_workspace_pill_resizing.description"
  default = true

  [[widget.setting]]
  key = "workspace_pill_resize_duration"
  type = "int"
  label_key = "settings.gesture_map.workspace_pill_resize_duration.label"
  description_key = "settings.gesture_map.workspace_pill_resize_duration.description"
  default = 280
  min = 100
  max = 1000

  [[widget.setting]]
  key = "open_launcher_on_empty_workspace"
  type = "bool"
  label_key = "settings.gesture_map.open_launcher_on_empty_workspace.label"
  description_key = "settings.gesture_map.open_launcher_on_empty_workspace.description"
  default = false

  [[widget.setting]]
  key = "launcher_opening_command"
  type = "string"
  label_key = "settings.gesture_map.launcher_opening_command.label"
  description_key = "settings.gesture_map.launcher_opening_command.description"
  default = "noctalia msg panel-open launcher"

  [[widget.setting]]
  key = "open_launcher_on_focus"
  type = "bool"
  label_key = "settings.gesture_map.open_launcher_on_focus.label"
  description_key = "settings.gesture_map.open_launcher_on_focus.description"
  default = false

  [[widget.setting]]
  key = "close_launcher_leaving_empty_workspace"
  type = "bool"
  label_key = "settings.gesture_map.close_launcher_leaving_empty_workspace.label"
  description_key = "settings.gesture_map.close_launcher_leaving_empty_workspace.description"
  default = false

  [[widget.setting]]
  key = "open_launcher_at_workspace_edge"
  type = "bool"
  label_key = "settings.gesture_map.open_launcher_at_workspace_edge.label"
  description_key = "settings.gesture_map.open_launcher_at_workspace_edge.description"
