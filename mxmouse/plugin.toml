  label_key = "settings.gesture_map.hide_empty_workspaces.label"
  description_key = "settings.gesture_map.hide_empty_workspaces.description"
  default = false

  [[widget.setting]]
  key = "workspace_badge_radius"
  type = "int"
  label_key = "settings.gesture_map.workspace_badge_radius.label"
  description_key = "settings.gesture_map.workspace_badge_radius.description"
  default = 6
  min = 0
  max = 24

  [[widget.setting]]
  key = "widget_width"
  type = "int"
  label_key = "settings.gesture_map.widget_width.label"
  description_key = "settings.gesture_map.widget_width.description"
  default = 190
  min = 60
  max = 600

  [[widget.setting]]
  key = "target_min_width_percent"
  type = "int"
  label_key = "settings.gesture_map.target_min_width_percent.label"
  description_key = "settings.gesture_map.target_min_width_percent.description"
  default = 10
  min = 1
  max = 50

  [[widget.setting]]
  key = "pill_radius"
  type = "int"
  label_key = "settings.gesture_map.pill_radius.label"
  description_key = "settings.gesture_map.pill_radius.description"
  default = 6
  min = 0
  max = 24

  [[widget.setting]]
  key = "icon_size_percent"
  type = "int"
  label_key = "settings.gesture_map.icon_size_percent.label"
  description_key = "settings.gesture_map.icon_size_percent.description"
  default = 70
  min = 25
  max = 150

  [[widget.setting]]
  key = "horizontal_pill_padding"
  type = "int"
  label_key = "settings.gesture_map.horizontal_pill_padding.label"
  description_key = "settings.gesture_map.horizontal_pill_padding.description"
  default = 2
  min = 0
  max = 16

  [[widget.setting]]
  key = "vertical_pill_padding"
  type = "int"
  label_key = "settings.gesture_map.vertical_pill_padding.label"
  description_key = "settings.gesture_map.vertical_pill_padding.description"
