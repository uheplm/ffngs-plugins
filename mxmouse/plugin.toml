  label_key = "settings.gesture_map.launcher_workspace_edge.label"
  default = "end"
  options = [
    { value = "start", label_key = "settings.gesture_map.launcher_workspace_edge.start" },
    { value = "end", label_key = "settings.gesture_map.launcher_workspace_edge.end" },
  ]

  [[widget.setting]]
  key = "launcher_glyph"
  type = "string"
  label_key = "settings.gesture_map.launcher_glyph.label"
  description_key = "settings.gesture_map.launcher_glyph.description"
  default = "apps"

  [[widget.setting]]
  key = "dominant_axis_progress"
  type = "bool"
  label_key = "settings.gesture_map.dominant_axis_progress.label"
  description_key = "settings.gesture_map.dominant_axis_progress.description"
  default = false

  [[widget.setting]]
  key = "dynamic_progress_opacity"
  type = "bool"
  label_key = "settings.gesture_map.dynamic_progress_opacity.label"
  description_key = "settings.gesture_map.dynamic_progress_opacity.description"
  default = false

  [[widget.setting]]
