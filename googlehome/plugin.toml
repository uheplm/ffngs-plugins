id = "ffngs/googlehome"
name = "Google Home"
version = "1.0.13"
plugin_api = 43
author = "ffngs"
license = "MIT"
icon = "brand-google-home"
description = "Control playback and cast media to Google Home Mini speakers."
dependencies = ["catt"]
tags = ["audio", "media", "panel", "utility"]

[[setting]]
key = "poll_interval"
type = "int"
label_key = "settings.poll_interval.label"
description_key = "settings.poll_interval.description"
default = 5
min = 1
max = 60

[[panel]]
id = "remote"
entry = "main.luau"
width = 700
height = 760
placement = "floating"
position = "center"
capture_keys = ["Escape"]

[[widget]]
id = "mini-player"
entry = "widget.luau"
